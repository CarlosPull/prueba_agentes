<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa de memoria · Cognee</title>
  <style>
    :root { color-scheme: dark; --bg:#07131c; --panel:#0d1d28; --line:#274352; --text:#edf8f5; --muted:#9db3b7; --mint:#58e6bb; --amber:#ffc66d; --danger:#ff7c85; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--text); background:radial-gradient(circle at 10% 0%, #14313b, transparent 34rem), var(--bg); font:15px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif; }
    button,input,select { font:inherit; }
    button,input,select { color:var(--text); background:#102733; border:1px solid var(--line); border-radius:.55rem; padding:.58rem .7rem; }
    button { cursor:pointer; font-weight:700; }
    button:hover { border-color:var(--mint); }
    :focus-visible { outline:3px solid color-mix(in srgb,var(--mint) 60%,transparent); outline-offset:2px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:1rem; padding:1.3rem 1.5rem .9rem; }
    h1 { margin:0; font-size:clamp(1.25rem,3vw,2rem); letter-spacing:-.03em; }
    .eyebrow { margin:0 0 .25rem; color:var(--mint); font-size:.76rem; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }
    .status { color:var(--muted); text-align:right; }
    .controls { display:grid; grid-template-columns:minmax(14rem,2fr) minmax(12rem,2fr) 7rem auto auto auto; gap:.65rem; padding:0 1.5rem 1rem; }
    label { display:grid; gap:.25rem; color:var(--muted); font-size:.78rem; }
    .check { display:flex; align-items:end; padding-bottom:.55rem; gap:.5rem; white-space:nowrap; }
    .check input { width:1rem; height:1rem; }
    main { display:grid; grid-template-columns:minmax(0,1fr) 19rem; min-height:calc(100vh - 10.5rem); border-top:1px solid var(--line); }
    .canvas { position:relative; min-height:34rem; overflow:hidden; background-image:linear-gradient(#17303b55 1px,transparent 1px),linear-gradient(90deg,#17303b55 1px,transparent 1px); background-size:32px 32px; }
    svg { width:100%; height:100%; min-height:34rem; display:block; touch-action:none; }
    .edge { stroke:#78919a; stroke-opacity:.42; }
    .node { cursor:grab; stroke:#07131c; stroke-width:2; }
    .node:active { cursor:grabbing; }
    .node-label { fill:var(--text); font-size:11px; paint-order:stroke; stroke:#07131c; stroke-width:3px; pointer-events:none; }
    aside { border-left:1px solid var(--line); background:color-mix(in srgb,var(--panel) 92%,transparent); padding:1rem; overflow:auto; }
    aside h2 { margin:.1rem 0 .6rem; font-size:1rem; }
    .hint,.empty { color:var(--muted); }
    .details { white-space:pre-wrap; overflow-wrap:anywhere; color:#c9dcde; font:12px/1.55 ui-monospace,SFMono-Regular,monospace; }
    .legend { display:flex; flex-wrap:wrap; gap:.45rem .8rem; margin-top:1rem; color:var(--muted); font-size:.75rem; }
    .dot { display:inline-block; width:.65rem; height:.65rem; border-radius:50%; margin-right:.28rem; }
    .error { color:var(--danger); }
    .busy::after { content:""; display:inline-block; width:.7rem; height:.7rem; margin-left:.4rem; border:2px solid var(--line); border-top-color:var(--mint); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width:850px) { .controls{grid-template-columns:1fr 1fr}.controls label:nth-child(2){grid-column:1/-1} main{grid-template-columns:1fr} aside{border-left:0;border-top:1px solid var(--line);min-height:12rem} }
    @media (max-width:520px) { header{align-items:start;flex-direction:column}.status{text-align:left}.controls{grid-template-columns:1fr}.controls label:nth-child(2){grid-column:auto} }
    @media (prefers-reduced-motion:reduce) { * { animation-duration:.01ms!important; } }
  </style>
</head>
<body>
  <header>
    <div><p class="eyebrow">Memory Gateway</p><h1>Mapa vivo de memoria</h1></div>
    <div id="status" class="status" role="status">Conectando…</div>
  </header>
  <section class="controls" aria-label="Controles del grafo">
    <label>Memoria<select id="dataset"><option value="">Cargando…</option></select></label>
    <label>Enfocar por significado<input id="query" type="search" maxlength="1000" placeholder="Ej. autenticación, pagos, usuarios"></label>
    <label>Nodos<select id="maxNodes"><option>100</option><option selected>250</option><option>500</option><option>1000</option></select></label>
    <button id="refresh" type="button">Actualizar</button>
    <label class="check"><input id="domain" type="checkbox" checked> Vista de dominio</label>
    <label class="check"><input id="auto" type="checkbox" checked> Auto · 15 s</label>
  </section>
  <main>
    <section class="canvas" aria-label="Grafo interactivo"><svg id="graph" role="img" aria-label="Relaciones de la memoria"><g id="viewport"><g id="edges"></g><g id="nodes"></g></g></svg></section>
    <aside><h2>Detalle</h2><p id="hint" class="hint">Selecciona un nodo. Arrastra para moverlo; usa la rueda para ampliar.</p><pre id="details" class="details"></pre><div id="legend" class="legend"></div></aside>
  </main>
  <script>
    const $=id=>document.getElementById(id), palette=['#58e6bb','#ffc66d','#70b7ff','#c59aff','#ff8991','#82df70','#f79ee6'];
    const state={nodes:[],links:[],scale:1,tx:0,ty:0,drag:null,pan:null,raf:0};
    const status=(text,error=false)=>{ $('status').textContent=text; $('status').className=`status${error?' error':''}`; };
    const identity=value=>String(value?.id??value?.identifier??value?.name??value??'');
    function normalize(graph){
      const technical=new Set(['textdocument','documentchunk','textsummary','entitytype','document','chunk']);
      const nodeMap=new Map(), idMap=new Map();
      (graph.nodes||[]).forEach((raw,index)=>{
        const origId=identity(raw)||`n-${index}`;
        const type=String(raw.type??raw.node_type??raw.kind??'Entidad');
        const label=String(raw.label??raw.name??raw.title??origId);
        if($('domain').checked&&technical.has(type.toLowerCase().replaceAll('_','')))return;
        const canonicalId=(type.toLowerCase()==='repositorio'&&label)?`repo:${label}`:origId;
        idMap.set(origId,canonicalId);
        if(!nodeMap.has(canonicalId)){
          nodeMap.set(canonicalId,{id:canonicalId,label,type,raw,x:0,y:0,vx:0,vy:0});
        }
      });
      const nodes=Array.from(nodeMap.values());
      const known=new Set(nodes.map(n=>n.id));
      const links=(graph.links||graph.edges||[]).map(raw=>{
        const origSrc=identity(raw.source??raw.source_id??raw.from);
        const origTgt=identity(raw.target??raw.target_id??raw.to);
        const source=idMap.get(origSrc)||origSrc;
        const target=idMap.get(origTgt)||origTgt;
        const label=String(raw.label??raw.relation??raw.relationship_name??raw.edge_info?.relationship_name??raw.type??'');
        return {source,target,label,raw};
      }).filter(link=>known.has(link.source)&&known.has(link.target));
      const level=new Map(nodes.map(node=>[node.id,0]));for(let pass=0;pass<3;pass+=1)for(const link of links){const relation=link.label.toLowerCase();if(relation.includes('modulo')||relation.includes('module'))level.set(link.target,Math.max(level.get(link.target)||0,1));if(relation.includes('endpoint')||relation.includes('tecnolog')||relation.includes('technology'))level.set(link.target,Math.max(level.get(link.target)||0,2));}
      const groups=[0,1,2,3].map(value=>nodes.filter(node=>(level.get(node.id)||0)===value));for(const [value,group] of groups.entries())group.forEach((node,index)=>{node.level=value;node.x=(innerWidth*.72)*(index+1)/(group.length+1);node.y=100+value*180;});
      return {nodes,links};
    }
    function color(type){let hash=0;for(const c of type)hash=(hash*31+c.charCodeAt(0))|0;return palette[Math.abs(hash)%palette.length];}
    function render(raw){
      cancelAnimationFrame(state.raf); Object.assign(state,normalize(raw)); const edges=$('edges'),nodes=$('nodes'); edges.replaceChildren(); nodes.replaceChildren();
      const nodeMap=new Map(state.nodes.map(node=>[node.id,node]));
      for(const link of state.links){const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.classList.add('edge');line.setAttribute('stroke-width','1.2');const title=document.createElementNS('http://www.w3.org/2000/svg','title');title.textContent=link.label||`${link.source} → ${link.target}`;line.append(title);edges.append(line);link.el=line;link.a=nodeMap.get(link.source);link.b=nodeMap.get(link.target);}
      for(const node of state.nodes){const group=document.createElementNS('http://www.w3.org/2000/svg','g');group.setAttribute('tabindex','0');group.setAttribute('role','button');group.setAttribute('aria-label',node.label);const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');circle.classList.add('node');circle.setAttribute('r','8');circle.setAttribute('fill',color(node.type));const label=document.createElementNS('http://www.w3.org/2000/svg','text');label.classList.add('node-label');label.setAttribute('x','11');label.setAttribute('y','4');label.textContent=node.label.length>34?node.label.slice(0,31)+'…':node.label;group.append(circle,label);group.addEventListener('pointerdown',event=>{event.stopPropagation();state.drag=node;group.setPointerCapture(event.pointerId)});group.addEventListener('click',()=>showNode(node));group.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();showNode(node)}});nodes.append(group);node.el=group;}
      const types=[...new Set(state.nodes.map(n=>n.type))];$('legend').replaceChildren(...types.map(type=>{const span=document.createElement('span'),dot=document.createElement('i');dot.className='dot';dot.style.background=color(type);span.append(dot,document.createTextNode(type));return span;}));
      let ticks=0; function simulate(){const width=$('graph').clientWidth;for(const node of state.nodes){node.vx+=(width/2-node.x)*.0003;node.vy+=(100+(node.level||0)*180-node.y)*.002;}for(const link of state.links){const a=link.a,b=link.b;if(!a||!b)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,force=((d-150)/d)*.0018;a.vx+=dx*force;a.vy+=dy*force;b.vx-=dx*force;b.vy-=dy*force;}for(let i=0;i<state.nodes.length;i++){for(let j=i+1;j<Math.min(state.nodes.length,i+50);j++){const a=state.nodes[i],b=state.nodes[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+1,force=Math.min(.12,180/d2);a.vx-=dx*force;a.vy-=dy*force;b.vx+=dx*force;b.vy+=dy*force;}}for(const n of state.nodes){if(n!==state.drag){n.vx*=.86;n.vy*=.86;n.x+=n.vx;n.y+=n.vy;}n.el.setAttribute('transform',`translate(${n.x},${n.y})`);}for(const l of state.links){const a=l.a,b=l.b;l.el.setAttribute('x1',a.x);l.el.setAttribute('y1',a.y);l.el.setAttribute('x2',b.x);l.el.setAttribute('y2',b.y);}if(ticks++<300)state.raf=requestAnimationFrame(simulate);} simulate();
    }
    function showNode(node){$('hint').textContent=`${node.label} · ${node.type}`;$('details').textContent=JSON.stringify(node.raw,null,2);}
    async function json(url){const response=await fetch(url,{cache:'no-store'}),payload=await response.json().catch(()=>({error:'respuesta inválida'}));if(!response.ok)throw new Error(payload.error||`HTTP ${response.status}`);return payload;}
    async function loadDatasets(){try{const payload=await json('/api/datasets'),select=$('dataset'),previous=select.value;select.replaceChildren();const allOpt=document.createElement('option');allOpt.value='ALL_DATASETS';allOpt.textContent='🌐 Vista General del Proyecto (Todos los Datasets)';select.append(allOpt);for(const item of payload.datasets||[]){const option=document.createElement('option');option.value=item.id;option.textContent=item.name.replace(/^prueba_agentes_/,'');select.append(option);}if(previous&&[...select.options].some(o=>o.value===previous))select.value=previous;if(!select.value){status('No hay grafos indexados todavía');render({nodes:[],links:[]});return;}await loadGraph();}catch(error){status(error.message,true);}}
    async function loadGraph(){const id=$('dataset').value;if(!id)return;$('refresh').classList.add('busy');try{const params=new URLSearchParams({dataset_id:id,query:$('query').value,max_nodes:$('maxNodes').value,neighborhood_depth:'2'}),payload=await json('/api/graph?'+params),graph=payload.graph||{};render(graph);status(`${state.nodes.length} nodos · ${state.links.length} relaciones · ${new Date().toLocaleTimeString()}`);}catch(error){status(error.message,true);}finally{$('refresh').classList.remove('busy');}}
    $('refresh').addEventListener('click',loadGraph);$('dataset').addEventListener('change',loadGraph);$('domain').addEventListener('change',loadGraph);$('query').addEventListener('keydown',e=>{if(e.key==='Enter')loadGraph()});
    const svg=$('graph'),viewport=$('viewport');function transform(){viewport.setAttribute('transform',`translate(${state.tx} ${state.ty}) scale(${state.scale})`)}svg.addEventListener('wheel',e=>{e.preventDefault();state.scale=Math.max(.25,Math.min(4,state.scale*(e.deltaY<0?1.1:.9)));transform()},{passive:false});svg.addEventListener('pointerdown',e=>{if(e.target===svg)state.pan={x:e.clientX-state.tx,y:e.clientY-state.ty}});svg.addEventListener('pointermove',e=>{if(state.drag){const rect=svg.getBoundingClientRect();state.drag.x=(e.clientX-rect.left-state.tx)/state.scale;state.drag.y=(e.clientY-rect.top-state.ty)/state.scale;}else if(state.pan){state.tx=e.clientX-state.pan.x;state.ty=e.clientY-state.pan.y;transform();}});svg.addEventListener('pointerup',()=>{state.drag=null;state.pan=null});svg.addEventListener('pointercancel',()=>{state.drag=null;state.pan=null});
    let refreshCycle=0;setInterval(()=>{if($('auto').checked&&!document.hidden){refreshCycle+=1;if(refreshCycle%4===0)loadDatasets();else loadGraph();}},15000);loadDatasets();
  </script>
</body>
</html>
